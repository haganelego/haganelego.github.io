# Languages
#   Documentation: https://docs.hugoblox.com/reference/language/
# Japanese is the default language: / redirects to /ja/, English lives under /en/.
# Content directories per language are mounted in module.yaml (content -> en, content/ja -> ja).

ja:
  languageCode: ja
  languageName: 日本語
  weight: 1

en:
  languageCode: en-us
  languageName: English
  weight: 2
